<!doctype html>
<html lang="zh-Hant">
<head>

<title>戀愛腦拍賣行｜戀愛腦指數測試</title>
<style>
:root{--red:#8b1e18;--red2:#b53a32;--pink:#f2b5b8;--paper:#f6ead8;--ink:#261b16;--muted:#6f574d;--line:#d6b7a1;--dark:#140f0d}*{box-sizing:border-box}body{margin:0;font-family:"Noto Serif TC","Songti TC","Microsoft JhengHei",serif;color:var(--ink);background:radial-gradient(circle at 10% 20%,rgba(181,58,50,.20),transparent 25%),radial-gradient(circle at 90% 10%,rgba(242,181,184,.25),transparent 25%),linear-gradient(135deg,#1c1513 0%,#3a1714 35%,#120d0c 100%);min-height:100vh;padding:24px}.wrap{max-width:920px;margin:0 auto}.card{background:var(--paper);border:2px solid #3a1714;box-shadow:0 20px 60px rgba(0,0,0,.35);border-radius:22px;overflow:hidden;position:relative}.card:before{content:"";position:absolute;inset:12px;border:1px dashed rgba(139,30,24,.35);pointer-events:none;border-radius:16px}.header{padding:34px 36px 20px;background:linear-gradient(90deg,rgba(139,30,24,.16),transparent 50%,rgba(139,30,24,.12)),var(--paper);border-bottom:2px solid rgba(139,30,24,.25)}.badge{display:inline-block;background:var(--red);color:#fff;padding:7px 12px;border-radius:999px;font-size:13px;letter-spacing:.08em;margin-bottom:14px}h1{margin:0;font-size:42px;letter-spacing:.04em;line-height:1.08}.subtitle{font-size:18px;color:var(--red2);font-weight:700;margin-top:12px}.body{padding:26px 36px 34px}.note{background:#fff8ef;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);line-height:1.7;margin-bottom:22px;font-size:15px}.progress{height:10px;background:#ead5c2;border-radius:999px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--red2),#e88a93);transition:.25s}.qno{color:var(--red);font-weight:800;margin-bottom:8px;font-size:16px}.question{font-size:25px;font-weight:800;line-height:1.35;margin-bottom:18px}.options{display:grid;gap:12px}.opt{border:1.5px solid var(--line);background:#fffaf2;border-radius:15px;padding:14px 16px;cursor:pointer;line-height:1.55;font-size:17px;transition:.18s;display:flex;gap:11px;align-items:flex-start}.opt:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(139,30,24,.12);border-color:var(--red2)}.opt.selected{background:#f7d6d8;border-color:var(--red);box-shadow:0 0 0 3px rgba(181,58,50,.12)}.letter{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-family:Arial,sans-serif}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}button{appearance:none;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:800;cursor:pointer;background:var(--red);color:white;box-shadow:0 8px 18px rgba(139,30,24,.25)}button.secondary{background:#fff8ef;color:var(--red);border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}.result{display:none;text-align:center;padding:8px 0 4px}.score{font-size:18px;color:var(--muted);margin:8px 0 14px}.result h2{font-size:38px;margin:8px 0;color:var(--red)}.tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.tag{background:#fff8ef;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--red);font-weight:700}.resultText{max-width:680px;margin:0 auto;background:#fffaf2;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;line-height:1.85;font-size:17px}.posterLine{margin:20px auto 0;max-width:680px;background:#2a1512;color:#fff;border-radius:16px;padding:16px;font-size:21px;font-weight:900;letter-spacing:.04em}.share{margin-top:18px;color:var(--muted);font-size:14px;line-height:1.7}.footer{border-top:1px solid rgba(139,30,24,.2);padding:16px 36px;color:#6f574d;font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:rgba(255,255,255,.28)}.hidden{display:none}@media(max-width:620px){body{padding:12px}.header{padding:28px 22px 16px}.body{padding:22px}.footer{padding:14px 22px}h1{font-size:32px}.question{font-size:21px}.opt{font-size:16px}.result h2{font-size:30px}}
</style>
</head><body><div class="wrap"><div class="card"><div class="header"><div class="badge">LOVE BRAIN AUCTION HOUSE</div><h1>戀愛腦指數測試</h1><div class="subtitle">愛無定價，故事無價。你的戀愛腦指數，今天可以估一估。</div></div><div class="body"><div id="intro"><div class="note">本測試為《戀愛腦拍賣行》展演活動互動測評，僅用於趣味參與與情緒表達，不代表專業心理診斷。請根據第一直覺作答，看看你會成為哪一種「情緒拍品」。</div><button onclick="startQuiz()">開始估價</button></div><div id="quiz" class="hidden"><div class="progress"><div class="bar" id="bar"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="nav"><button class="secondary" id="prevBtn" onclick="prevQuestion()">上一題</button><button id="nextBtn" onclick="nextQuestion()" disabled>下一題</button></div></div><div id="result" class="result"><div class="badge">拍賣結果</div><h2 id="rtype"></h2><div class="score" id="score"></div><div class="tags" id="tags"></div><div class="resultText" id="rtext"></div><div class="posterLine" id="posterLine"></div><div class="share">歡迎來到《戀愛腦拍賣行》。你的故事值得被看見，但你不需要被拍賣。<br>你可以截圖分享你的結果，或把測試連結發給朋友一起估價。</div><div class="nav" style="justify-content:center"><button onclick="restart()">重新測試</button></div></div></div><div class="footer"><span>《戀愛腦拍賣行》互動測評</span><span>你可以為愛投入，但不必把自己拍賣出去。</span></div></div></div><script>
const questions=[['喜歡的人突然不回消息，你通常會？',['先去做自己的事，等對方有空再說','有點在意，但不會一直盯著手機','反覆點開聊天框，開始猜測原因','腦補一整部感情懸疑片，甚至想發小作文']],['如果對方臨時取消約會，你會？',['接受安排，自己也可以過得很好','有點失望，但會表達自己的感受','表面說沒事，心裡反覆難過','立刻開始替對方找理由，覺得一定是自己不夠好']],['戀愛中你最容易付出的是什麼？',['合理的時間和情緒','會多花一些心思，但有邊界','經常犧牲自己的安排','只要對方需要，我的時間、計劃、情緒都可以讓位']],['朋友提醒你「這段關係不太對勁」時，你會？',['認真聽，並重新判斷關係','聽進去一部分，但還想再觀察','嘴上說知道，心裡繼續替對方解釋','覺得朋友不懂我們的感情']],['對方偶爾給你一點回應，你會？',['正常看待，不會過度解讀','會開心，但不會改變整體判斷','覺得也許還有希望','立刻復燃，開始重新規劃未來']],['如果一段關係讓你長期內耗，你會？',['及時止損','猶豫後嘗試溝通','一邊痛苦一邊繼續撐著','明知道不好，也覺得自己放不下']],['你怎麼看「為愛改變自己」？',['可以調整，但不能失去自己','小範圍改變可以接受','只要關係能變好，我願意改很多','如果是為了對方，我甚至可以不像自己']],['你最容易被哪句話打動？',['我們都要成為更好的自己','我會認真回應你的感受','只有你懂我','我只是現在還不能給你確定答案']],['關係裡出現冷暴力或忽冷忽熱時，你會？',['明確溝通，不行就離開','先觀察一段時間','嘗試用更多付出來換回應','越冷越上頭，越不確定越想證明自己']],['你對「沉沒成本」的態度是？',['付出過不代表必須繼續','會不捨，但可以慢慢抽離','因為付出太多，所以很難放手','我都堅持這麼久了，再等等也許就好了']],['如果讓你給自己的戀愛狀態寫一句話，你會選？',['愛別人之前，先把自己帶好','我可以真誠，但也要有邊界','我總是在關係裡想太多','我願意把自己拍賣給一段不確定的愛']],['參加《戀愛腦拍賣行》，你最想拍下什麼？',['清醒證明','邊界感說明書','被看見的情緒帳單','最後一枚尊嚴幣']]];
const results=[{min:0,max:7,type:'清醒人類誤入型',tags:['邊界感','自我穩定','低內耗'],text:'你的戀愛腦指數較低。你不是不會愛，而是更懂得在關係裡保留自我。你願意付出，但不會把自己的生活秩序完全交給別人。在《戀愛腦拍賣行》裡，你大概會站在出口區，默默領取一張「清醒證明」。',line:'你不是冷漠，只是沒有把自己弄丟。'},{min:8,max:14,type:'戀愛腦試用裝型',tags:['偶爾上頭','可自救','輕度內耗'],text:'你偶爾會上頭，也會被曖昧、回應和細節打動。但大多數時候，你還能把自己拉回來。你不是完全清醒，也不是徹底沉沒，而是在心動和理智之間來回搖擺。',line:'你只是偶爾戀愛腦，幸好還沒正式入庫。'},{min:15,max:22,type:'單向奔赴馬拉松型',tags:['長期付出','期待回應','舍不得止損'],text:'你的戀愛腦指數已經進入中段區間。你容易在關係中持續投入，也容易把對方的一點回應看成希望。你不是不知道累，而是常常舍不得停下來。',line:'你跑了很遠，但那個人未必在終點等你。'},{min:23,max:30,type:'沉沒成本續杯型',tags:['反覆原諒','難以抽離','情緒消耗'],text:'你很容易因為「已經付出太多」而繼續堅持。你知道這段關係可能不值得，但還是會想：再等等、再解釋一次、再給一次機會。你的問題不是不懂清醒，而是太擅長替別人找理由。',line:'你不是輸給愛情，是輸給了不甘心。'},{min:31,max:36,type:'鎮館冤種壓軸拍品型',tags:['高度上頭','自我損耗','需要贖回自己'],text:'你的戀愛腦指數已經達到拍賣行壓軸級別。你容易為了關係不斷讓步，也容易把不確定當成希望，把消耗理解成深情。但請記住：你可以為愛投入，但不必把自己拍賣出去。',line:'本次拍賣結束，請把自己帶回家。'}];
let current=0;let answers=Array(questions.length).fill(null);function startQuiz(){document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){const q=questions[current];document.getElementById('qno').textContent=`第 ${current+1} / ${questions.length} 題`;document.getElementById('question').textContent=q[0];document.getElementById('bar').style.width=`${current/questions.length*100}%`;const box=document.getElementById('options');box.innerHTML='';q[1].forEach((t,i)=>{const div=document.createElement('div');div.className='opt'+(answers[current]===i?' selected':'');div.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${t}</span>`;div.onclick=()=>{answers[current]=i;render()};box.appendChild(div)});document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=answers[current]===null;document.getElementById('nextBtn').textContent=current===questions.length-1?'查看拍賣結果':'下一題'}function nextQuestion(){if(current<questions.length-1){current++;render()}else showResult()}function prevQuestion(){if(current>0){current--;render()}}function showResult(){const score=answers.reduce((a,b)=>a+b,0);const r=results.find(x=>score>=x.min&&score<=x.max);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').style.display='block';document.getElementById('rtype').textContent=r.type;document.getElementById('score').textContent=`你的戀愛腦指數：${score} / 36`;document.getElementById('tags').innerHTML=r.tags.map(t=>`<span class="tag">${t}</span>`).join('');document.getElementById('rtext').textContent=r.text;document.getElementById('posterLine').textContent=r.line;document.getElementById('bar').style.width='100%'}function restart(){current=0;answers=Array(questions.length).fill(null);document.getElementById('result').style.display='none';document.getElementById('intro').classList.remove('hidden')}
</script></body></html>
